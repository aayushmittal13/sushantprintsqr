services:
  - type: web
    name: sushant-orders
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/me
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: CHANGE_PIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
